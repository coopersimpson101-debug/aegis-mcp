<text x="22" y="348" xml:space="preserve"><tspan fill="#8b949e">model → </tspan><tspan fill="#e6edf3">printer_set_temperature</tspan><tspan fill="#8b949e"> {"heater": "bed", "target_c": 130}</tspan></text>
