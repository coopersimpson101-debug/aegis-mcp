<text x="22" y="68" fill="#818CF8">$ <tspan fill="#e6edf3">python scripts/make_figures.py   # safety walkthrough</tspan></text>
<text x="22" y="88" xml:space="preserve"><tspan fill="#8b949e">model → </tspan><tspan fill="#e6edf3">printer_set_temperature</tspan><tspan fill="#8b949e"> {"heater": "bed", "target_c": 60}</tspan></text>
